# PostgreSQL para desenvolvimento e homologação. Execute na pasta sistema/.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: sgs
      POSTGRES_USER: sgs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgs -d sgs"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
