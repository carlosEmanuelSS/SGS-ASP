name: sgs-asp
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: sgs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Defina a senha administrativa do banco}
      SGS_DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina a senha da aplicacao}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/01-sgs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgs -d sgs"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defina uma chave aleatoria}
      DJANGO_ALLOWED_HOSTS: ${SGS_DOMAIN:?Defina o dominio},localhost
      CSRF_TRUSTED_ORIGINS: https://${SGS_DOMAIN}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: sgs
      POSTGRES_USER: sgs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TRUST_PROXY_HEADERS: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SGS_DOMAIN: ${SGS_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
  backup:
    image: postgres:17
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: sgs
      PGUSER: sgs
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
